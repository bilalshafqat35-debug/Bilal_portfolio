{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Bilal | Full Stack Django Developer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- MINIMALIST MONOCHROME THEME --- */
        body { 
            background-color: #0D0D0D; /* Jet Black */
            color: #E0E0E0; /* Light Gray */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden;
        }
        
        /* Floating Hamburger Menu Button */
                /* Floating Hamburger Menu Button */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px; /* Left ki jagah Right kar diya */
            left: auto;  /* Left ko auto kar diya taake text ke sath na aaye */
            z-index: 1050;
            background: #0D0D0D; /* Text ke sath mix na ho isliye background diya */
            border: 1px solid #333;
            color: #FFFFFF;
            font-size: 24px;
            padding: 5px 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Thoda sa shadow */
        }
        .menu-btn:hover {
            background: #FFFFFF;
            color: #0D0D0D;
        }

        /* --- FULL SCREEN MENU OVERLAY --- */
        .fullscreen-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0D0D0D;
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease-in-out;
        }

        .fullscreen-menu.show {
            opacity: 1;
            visibility: visible;
        }

        .fullscreen-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .fullscreen-menu ul li {
            margin: 20px 0;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .fullscreen-menu.show ul li {
            transform: translateY(0);
            opacity: 1;
        }

        /* Staggered delays for each item */
        .fullscreen-menu.show ul li:nth-child(1) { transition-delay: 0.1s; }
        .fullscreen-menu.show ul li:nth-child(2) { transition-delay: 0.2s; }
        .fullscreen-menu.show ul li:nth-child(3) { transition-delay: 0.3s; }
        .fullscreen-menu.show ul li:nth-child(4) { transition-delay: 0.4s; }
        .fullscreen-menu.show ul li:nth-child(5) { transition-delay: 0.5s; }
        .fullscreen-menu.show ul li:nth-child(6) { transition-delay: 0.6s; }

        .fullscreen-menu ul li a {
            color: #999;
            text-decoration: none;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-menu ul li a i {
            margin-right: 20px;
            font-size: 1.8rem;
        }

        .fullscreen-menu ul li a:hover {
            color: #FFFFFF;
            transform: scale(1.05);
        }

        /* Hero Section */
        .hero-section { 
            height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center; 
        }
        .hero-section h1 { font-size: 4rem; font-weight: 800; color: #FFFFFF; }
        .hero-section h1 span { color: #FFFFFF; text-decoration: underline; text-underline-offset: 10px; text-decoration-thickness: 3px;}
        .hero-section p { font-size: 1.2rem; color: #999; }
        
        /* Buttons */
        .btn-custom { 
            background-color: #FFFFFF; 
            color: #0D0D0D; 
            font-weight: bold; 
            border-radius: 0px; 
            padding: 12px 30px; 
            border: 1px solid #FFFFFF;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .btn-custom::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            z-index: -1;
        }
        .btn-custom:hover::before { left: 0; }
        .btn-custom:hover { background-color: transparent; color: #FFFFFF; }

        /* Sections & Cards */
        .section-title { text-align: center; margin-bottom: 10px; font-weight: 700; color: #FFFFFF; text-transform: uppercase; letter-spacing: 2px;}
        .card-custom { 
            background-color: #121212; 
            border: 1px solid #333; 
            border-radius: 0px; 
            transition: 0.3s; 
        }
        .card-custom:hover { transform: translateY(-5px); border-color: #FFFFFF; }
        .card-title { color: #FFFFFF; font-weight: bold; }
        
        /* Padding for sections */
        section { padding: 80px 0; }
        
        /* Footer */
        footer { 
            background-color: #121212; 
            padding: 30px 0; 
            text-align: center; 
            border-top: 1px solid #333;
            color: #999;
        }

        /* --- PREMIUM ANIMATIONS --- */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .sleek-line {
            width: 0;
            height: 1px;
            background-color: #FFFFFF;
            margin: 0 auto 30px auto;
            transition: width 1s ease-in-out;
        }
        .active .sleek-line { width: 60px; }
        
        .premium-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .premium-grid .card-custom { position: relative; overflow: hidden; }
        .premium-grid .card-custom img { transition: transform 0.5s ease; }
        .premium-grid .card-custom:hover img { transform: scale(1.05); }

        /* Internship Badges */
        .badge-internship {
            background-color: #121212;
            border: 1px solid #333;
            color: #E0E0E0;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .badge-internship:hover {
            border-color: #FFFFFF;
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }
                /* =========================================
           MOBILE RESPONSIVENESS (Screens < 768px)
           ========================================= */
        @media (max-width: 768px) {
            /* Hero Section */
            .hero-section { padding: 100px 15px 50px 15px; height: auto; min-height: 100vh; }
            .hero-section h1 { font-size: 2.5rem; } /* Heading choti ki */
            .hero-section h2 { font-size: 1.2rem; }
            .hero-section p { font-size: 1rem; }
            
            /* Text Padding */
            .container { padding-left: 20px; padding-right: 20px; }
            
            /* Menu Button */
                        .menu-btn { top: 15px; right: 15px; left: auto; font-size: 20px; padding: 5px 12px; }

            /* Full Screen Menu */
            .fullscreen-menu ul li a { font-size: 1.5rem; }
            .fullscreen-menu ul li a i { font-size: 1.2rem; margin-right: 10px; }

            /* Badges */
            .badge-internship { font-size: 0.8rem; padding: 6px 12px; margin-bottom: 5px; }

            /* Sections Padding */
            section { padding: 50px 0; }
            .section-title { font-size: 1.5rem; }

            /* Contact Section */
            #contact h1 { font-size: 2.5rem !important; }
            .contact-form-wrapper { padding: 20px !important; }
            .contact-card { padding: 15px 20px; }
            .contact-value { font-size: 1.1rem; }
            
            /* Buttons */
            .btn-custom, .btn-outline-light { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Floating Hamburger Button -->
    <button class="menu-btn" id="menuToggle">
        <i class="fas fa-bars" id="menuIcon"></i>
    </button>

    <!-- Full Screen Menu Overlay -->
    <div class="fullscreen-menu" id="fullscreenMenu">
        <ul>
            <li><a href="#" class="menu-link" data-target="home"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" class="menu-link" data-target="projects"><i class="fas fa-briefcase"></i> Projects</a></li>
            <li><a href="#" class="menu-link" data-target="services"><i class="fas fa-cogs"></i> Services</a></li>
            <li><a href="#" class="menu-link" data-target="skills"><i class="fas fa-chart-bar"></i> Skills</a></li>
            <li><a href="#" class="menu-link" data-target="contact"><i class="fas fa-envelope"></i> Contact</a></li>
            
            <!-- Download Resume Link in Menu -->
            <li><a href="{% static 'resume/Muhammad_Bilal_Resume.pdf' %}" download style="color: #FFFFFF;"><i class="fas fa-download"></i> Download Resume</a></li>

            <li style="margin-top: 40px;"><a href="/admin/" target="_blank" style="font-size: 1.2rem; color: #666;"><i class="fas fa-lock"></i> Admin Login</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="mb-1">&copy; 2024 Muhammad Bilal. All Rights Reserved.</p>
            <p class="mb-0">Full Stack Django Developer</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // --- FULL SCREEN MENU TOGGLE ---
        const menuToggle = document.getElementById('menuToggle');
        const fullscreenMenu = document.getElementById('fullscreenMenu');
        const menuIcon = document.getElementById('menuIcon');
        const menuLinks = document.querySelectorAll('.menu-link');

        menuToggle.addEventListener('click', () => {
            fullscreenMenu.classList.toggle('show');
            if (fullscreenMenu.classList.contains('show')) {
                menuIcon.classList.replace('fa-bars', 'fa-times');
            } else {
                menuIcon.classList.replace('fa-times', 'fa-bars');
            }
        });

        // --- VIEW SWITCHING LOGIC ---
        menuLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Menu close karein
                fullscreenMenu.classList.remove('show');
                menuIcon.classList.replace('fa-times', 'fa-bars');

                // Sab sections chupayen
                const sections = document.querySelectorAll('.page-section');
                sections.forEach(sec => sec.style.display = 'none');

                // Sirf target wala section dikhayen
                const targetId = link.getAttribute('data-target');
                const targetSection = document.getElementById(targetId);
                
                if (targetSection) {
                    targetSection.style.display = 'block';
                    
                    // Animation trigger karein
                    setTimeout(() => {
                        targetSection.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
                        window.scrollTo(0, 0); 
                    }, 50);
                }
            });
        });

        // --- SCROLL REVEAL ANIMATIONS ON LOAD ---
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.page-section').forEach(sec => sec.style.display = 'none');
            document.getElementById('home').style.display = 'block';
            
            setTimeout(() => {
                document.querySelectorAll('#home .reveal').forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>
</html>
